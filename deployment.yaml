apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: devops-app
          image: 443568785245.dkr.ecr.us-east-1.amazonaws.com/devops-project:latest
          ports:
            - containerPort: 3000